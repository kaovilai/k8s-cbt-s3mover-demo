apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fs-writer-data
  namespace: cbt-demo
spec:
  accessModes:
  - ReadWriteOnce
  # Filesystem mode - how most real applications use volumes
  volumeMode: Filesystem
  storageClassName: csi-hostpath-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: fs-writer
  namespace: cbt-demo
  labels:
    app: fs-writer
    app.kubernetes.io/name: fs-writer
    app.kubernetes.io/component: workload
    app.kubernetes.io/part-of: k8s-cbt-s3mover-demo
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  containers:
  - name: writer
    image: busybox:1.37.0
    command:
    - /bin/sh
    - -c
    - "tail -f /dev/null"
    resources:
      requests:
        memory: "32Mi"
        cpu: "10m"
      limits:
        memory: "64Mi"
        cpu: "100m"
    volumeMounts:
    - name: data-volume
      mountPath: /data
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
  volumes:
  - name: data-volume
    persistentVolumeClaim:
      claimName: fs-writer-data
