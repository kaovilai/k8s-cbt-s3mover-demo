apiVersion: batch/v1
kind: Job
metadata:
  name: cbt-backup
  namespace: cbt-demo
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: cbt-backup-sa
      restartPolicy: Never
      containers:
      - name: backup
        image: cbt-backup:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/cbt-backup
        - create
        - --pvc=block-writer-data
        - --namespace=cbt-demo
        - --device=/dev/xvda
        - --s3-endpoint=minio.cbt-demo.svc.cluster.local:9000
        - --s3-access-key=$(S3_ACCESS_KEY)
        - --s3-secret-key=$(S3_SECRET_KEY)
        - --s3-bucket=snapshots
        - --service-account=cbt-backup-sa
        env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
        volumeDevices:
        - name: data-volume
          devicePath: /dev/xvda
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          privileged: true
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: block-writer-data
