apiVersion: batch/v1
kind: Job
metadata:
  name: cbt-restore-list
  namespace: cbt-demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: list
        image: cbt-restore:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/cbt-restore
        - list
        - --s3-endpoint=minio.cbt-demo.svc.cluster.local:9000
        - --s3-access-key=$(S3_ACCESS_KEY)
        - --s3-secret-key=$(S3_SECRET_KEY)
        - --s3-bucket=snapshots
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
