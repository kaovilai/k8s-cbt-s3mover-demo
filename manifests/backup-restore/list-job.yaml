apiVersion: batch/v1
kind: Job
metadata:
  name: cbt-restore-list
  namespace: cbt-demo
  labels:
    app.kubernetes.io/name: cbt-restore-list
    app.kubernetes.io/component: list
    app.kubernetes.io/part-of: k8s-cbt-s3mover-demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cbt-restore-list
        app.kubernetes.io/component: list
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      containers:
      - name: list
        image: cbt-restore:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/cbt-restore
        - list
        - --s3-endpoint=minio.cbt-demo.svc.cluster.local:9000
        - --s3-bucket=snapshots
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
