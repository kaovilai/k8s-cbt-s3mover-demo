apiVersion: batch/v1
kind: Job
metadata:
  name: cbt-restore
  namespace: cbt-demo
  labels:
    app.kubernetes.io/name: cbt-restore
    app.kubernetes.io/component: restore
    app.kubernetes.io/part-of: k8s-cbt-s3mover-demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cbt-restore
        app.kubernetes.io/component: restore
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: restore
        image: cbt-restore:latest
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/cbt-restore
        - restore
        - --snapshot=block-snapshot-1
        - --device=/dev/xvda
        - --s3-endpoint=minio.cbt-demo.svc.cluster.local:9000
        - --s3-bucket=snapshots
        env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-user
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: root-password
        volumeDevices:
        - name: restore-volume
          devicePath: /dev/xvda
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          privileged: true
      volumes:
      - name: restore-volume
        persistentVolumeClaim:
          claimName: restored-data
