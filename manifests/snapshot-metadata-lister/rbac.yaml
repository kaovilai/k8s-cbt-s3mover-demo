---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-client-sa
  namespace: cbt-demo
  labels:
    app.kubernetes.io/name: snapshot-metadata-lister
    app.kubernetes.io/component: tool
    app.kubernetes.io/part-of: k8s-cbt-s3mover-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-client-role
  labels:
    app.kubernetes.io/name: snapshot-metadata-lister
    app.kubernetes.io/component: tool
    app.kubernetes.io/part-of: k8s-cbt-s3mover-demo
rules:
- apiGroups: ["snapshot.storage.k8s.io"]
  resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["cbt.storage.k8s.io"]
  resources: ["snapshotmetadataservices"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-client-binding
  labels:
    app.kubernetes.io/name: snapshot-metadata-lister
    app.kubernetes.io/component: tool
    app.kubernetes.io/part-of: k8s-cbt-s3mover-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-client-role
subjects:
- kind: ServiceAccount
  name: csi-client-sa
  namespace: cbt-demo
